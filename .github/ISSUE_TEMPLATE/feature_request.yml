name: Feature request
description: Something you'd like AcesMotion to do.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to animate or build?
      description: The result you're after, not the feature yet.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The steps or workaround you use now, and what makes it slow or hard.
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, if you have an idea.
